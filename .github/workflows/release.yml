name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: libbox.aar
    uses: ./.github/workflows/libbox.yml

  release:
    name: publish APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Разложить ядро в app/libs
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Один и тот же debug-ключ между прогонами. Иначе каждый APK подписан
      # заново, и установка поверх предыдущей сборки падает по подписи.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Prepare keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.STRAVO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stravo-release.jks"
            echo "STRAVO_KEYSTORE_FILE=$RUNNER_TEMP/stravo-release.jks" >> "$GITHUB_ENV"
            echo "Подпись: keystore владельца."
          else
            echo "Подпись: debug-ключ (свой keystore не задан)."
          fi

      - name: Build release APK
        env:
          STRAVO_KEYSTORE_PASSWORD: ${{ secrets.STRAVO_KEYSTORE_PASSWORD }}
          STRAVO_KEY_ALIAS: ${{ secrets.STRAVO_KEY_ALIAS }}
          STRAVO_KEY_PASSWORD: ${{ secrets.STRAVO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/stravo-vpn-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/stravo-vpn-${GITHUB_REF_NAME}.apk" \
            --title "STRAVO VPN ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

