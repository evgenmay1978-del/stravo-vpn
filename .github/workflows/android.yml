name: Android build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ядро туннеля: AAR собирается в переиспользуемом workflow libbox.yml
  # (сначала кэш Actions, при промахе — сборка gomobile).
  core:
    name: libbox.aar
    uses: ./.github/workflows/libbox.yml

  build:
    name: assemble debug + release
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Разложить ядро в app/libs
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Один и тот же debug-ключ между прогонами. Иначе каждый APK подписан
      # заново, и установка поверх предыдущей сборки падает по подписи.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stravo-vpn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: stravo-vpn-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

