name: Android build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ядро туннеля: AAR собирается в переиспользуемом workflow libbox.yml
  # (сначала кэш Actions, при промахе — сборка gomobile).
  core:
    name: libbox.aar
    uses: ./.github/workflows/libbox.yml

  build:
    name: assemble debug + release
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Разложить ядро в app/libs
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Подпись — постоянным ключом из GitHub Secrets. Раньше ключ каждый прогон
      # генерировался заново (кэш ~/.android/debug.keystore в CI не сохранялся),
      # поэтому установка поверх предыдущей сборки падала по подписи. Свой ключ
      # используется и для debug, и для release: APK взаимозаменяемы.
      - name: Prepare keystore (обязателен для обновлений)
        env:
          KEYSTORE_B64: ${{ secrets.STRAVO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета STRAVO_KEYSTORE_BASE64 — сборка была бы подписана новым ключом, и обновление поверх установленного приложения стало бы невозможно."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stravo-signing.p12"
          echo "STRAVO_KEYSTORE_FILE=$RUNNER_TEMP/stravo-signing.p12" >> "$GITHUB_ENV"
          echo "Подпись: постоянный ключ из секретов."

      - name: Build debug APK
        env:
          STRAVO_KEYSTORE_PASSWORD: ${{ secrets.STRAVO_KEYSTORE_PASSWORD }}
          STRAVO_KEY_ALIAS: ${{ secrets.STRAVO_KEY_ALIAS }}
          STRAVO_KEY_PASSWORD: ${{ secrets.STRAVO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        env:
          STRAVO_KEYSTORE_PASSWORD: ${{ secrets.STRAVO_KEYSTORE_PASSWORD }}
          STRAVO_KEY_ALIAS: ${{ secrets.STRAVO_KEY_ALIAS }}
          STRAVO_KEY_PASSWORD: ${{ secrets.STRAVO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stravo-vpn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: stravo-vpn-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

