name: Build APK

on:
  push:
    branches: [ feature/stravo-vpn-mvp, main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ feature/stravo-vpn-mvp, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: List build outputs
      run: ls -la app/build/outputs/apk/*/

    - name: Upload Debug APK to Release (always)
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: "auto-build-${{ github.run_id }}"
        name: "Debug Build ${{ github.run_id }}"
        body: "Automatic debug build from commit ${{ github.sha }}"
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
