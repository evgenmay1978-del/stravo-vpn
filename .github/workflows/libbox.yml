name: libbox (sing-box Android core)

# Собирает libbox.aar через gomobile. Источник — форк Leadaxe/sing-box-lx (ветка lx):
# база — upstream sing-box 1.14.1, плюс клиентский транспорт XHTTP (тег with_xhttp),
# которого в upstream нет даже в 1.15.0-alpha. Ниже шаг возвращает with_clash_api:
# форк намеренно его не включает, а приложению он нужен для метрик (пинг/скорость).
#
# Ловушка, из-за которой 18.09.2026 владелец получил сборку с «VPN включается и сразу
# выключается»: форк упоминает with_clash_api в комментарии, поэтому проверка
# «grep -q with_clash_api» решала, что тег уже есть, и патч не применялся. Ядро
# собиралось без API метрик, а конфиг приложения с experimental.clash_api ядро
# отвергает целиком («clash api is not included in this build») — падал не транспорт,
# а весь запуск. Теперь проверяется сам тег в списке сборки, а после сборки теги
# в libbox.so проверяются отдельным шагом.
# Триггеры: ручной запуск и push, затрагивающий только этот файл,
# чтобы случайно не пересобирать ядро на каждый коммит приложения.
on:
  workflow_dispatch:
    inputs:
      singbox_repo:
        description: "Репозиторий sing-box"
        required: false
        default: "Leadaxe/sing-box-lx"
        type: string
      singbox_ref:
        description: "Ветка/тег sing-box: форк Leadaxe/sing-box-lx несёт клиентский XHTTP"
        required: false
        default: "lx"
        type: string
      go_version:
        description: "Версия Go"
        required: false
        default: "1.26.8"
        type: string
      gomobile_version:
        description: "Версия github.com/sagernet/gomobile"
        required: false
        default: "v0.1.13"
        type: string
      abi_target:
        description: "Значение gomobile -target"
        required: false
        default: "android/arm64,android/arm"
        type: string
      cache_version:
        description: "Инкремент для сброса кэша AAR"
        required: false
        default: "4"
        type: string
  # Вызывается из android.yml и release.yml: любой сборке приложения нужно ядро.
  workflow_call:
    inputs:
      singbox_repo:
        required: false
        default: "Leadaxe/sing-box-lx"
        type: string
      singbox_ref:
        required: false
        default: "lx"
        type: string
      go_version:
        required: false
        default: "1.26.8"
        type: string
      gomobile_version:
        required: false
        default: "v0.1.13"
        type: string
      abi_target:
        required: false
        default: "android/arm64,android/arm"
        type: string
      cache_version:
        required: false
        default: "4"
        type: string
  push:
    paths:
      - ".github/workflows/libbox.yml"

permissions:
  contents: read

jobs:
  libbox:
    name: build libbox.aar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout приложения (нужен каталог app/libs)
        uses: actions/checkout@v4

      - name: Параметры сборки
        id: params
        env:
          IN_REPO: ${{ inputs.singbox_repo || 'Leadaxe/sing-box-lx' }}
          IN_REF: ${{ inputs.singbox_ref || 'lx' }}
          IN_GO: ${{ inputs.go_version || '1.26.8' }}
          IN_GOMOBILE: ${{ inputs.gomobile_version || 'v0.1.13' }}
          IN_ABI: ${{ inputs.abi_target || 'android/arm64,android/arm' }}
          IN_CACHE: ${{ inputs.cache_version || '4' }}
        run: |
          set -euo pipefail
          ABI_SLUG="$(printf '%s' "$IN_ABI" | tr '/,' '--')"
          {
            echo "SINGBOX_REPO=$IN_REPO"
            echo "SINGBOX_REF=$IN_REF"
            echo "GO_VERSION=$IN_GO"
            echo "GOMOBILE_VERSION=$IN_GOMOBILE"
            echo "ABI_TARGET=$IN_ABI"
            echo "ABI_SLUG=$ABI_SLUG"
            echo "AAR_CACHE_KEY=libbox-aar-${IN_REF}-go${IN_GO}-gomobile${IN_GOMOBILE}-${ABI_SLUG}-v${IN_CACHE}"
          } >> "$GITHUB_ENV"
          echo "Кэш-ключ AAR: libbox-aar-${IN_REF}-go${IN_GO}-gomobile${IN_GOMOBILE}-${ABI_SLUG}-v${IN_CACHE}"

      - name: Restore libbox.aar из кэша
        id: aar-cache
        uses: actions/cache@v4
        with:
          # Кэшируем оба AAR одним ключом: основного достаточно для повторной
          # сборки, а legacy нужен, чтобы артефакт был полным и на cache-hit прогоне.
          path: |
            app/libs/libbox.aar
            app/libs/libbox-legacy.aar
          key: ${{ env.AAR_CACHE_KEY }}
          restore-keys: |
            libbox-aar-${{ env.SINGBOX_REF }}-go${{ env.GO_VERSION }}-

      - name: Checkout sing-box ${{ env.SINGBOX_REF }}
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SINGBOX_REPO }}
          ref: ${{ env.SINGBOX_REF }}
          path: sing-box
          fetch-depth: 1
          # Форк держит sing-tun, gVisor и uTLS сабмодулями (go.mod заменяет их на
          # ./submodules/*): без выкачки сборка падает на «reading submodules/utls/go.mod».
          submodules: recursive

      - name: Гарантировать тег версии (libbox читает git describe --tags)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          set -euo pipefail
          if ! git describe --tags >/dev/null 2>&1; then
            git tag -f "${{ env.SINGBOX_REF }}"
          fi
          echo "sing-box version: $(git describe --tags)"

      - name: Вернуть with_clash_api в теги сборки ядра
        if: steps.aar-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          set -euo pipefail
          FILE=cmd/internal/build_libbox/main.go
          # Ищем тег в кавычках, а не любое упоминание: форк объясняет в комментарии,
          # почему with_clash_api выключен, и прежняя проверка на это попадалась —
          # ядро собиралось без API метрик, а конфиг с ним ядро отвергает целиком.
          if grep -q '"with_clash_api"' "$FILE"; then
            echo "with_clash_api уже в тегах, патч не нужен"
          else
            # Форк намеренно не включает with_clash_api (свой протокол команд), но
            # приложению он нужен: через локальный API ядра берутся пинг и скорость.
            sed -i 's/append(sharedTags, "with_gvisor"/append(sharedTags, "with_gvisor", "with_clash_api"/' "$FILE"
            grep -q '"with_clash_api"' "$FILE" || {
              echo "::error::не удалось добавить with_clash_api в теги: строка sharedTags изменилась, патч нужно обновить"
              exit 1
            }
          fi
          grep -n 'sharedTags = append(sharedTags, "with_gvisor"' "$FILE" || true

      - name: Setup Go ${{ env.GO_VERSION }}
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Кэш Go-модулей и сборочного кэша
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ env.GO_VERSION }}-${{ env.SINGBOX_REF }}-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: |
            go-${{ env.GO_VERSION }}-${{ env.SINGBOX_REF }}-
            go-${{ env.GO_VERSION }}-

      - name: Setup Android NDK r28c (версия из CI форка)
        id: setup-ndk
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup JDK 17 (build_libbox требует ровно openjdk 17)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установка gomobile ${{ env.GOMOBILE_VERSION }}
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go install -v github.com/sagernet/gomobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          go install -v github.com/sagernet/gomobile/cmd/gobind@${{ env.GOMOBILE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox.aar
        if: steps.aar-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform "${{ env.ABI_TARGET }}"
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/app/libs/libbox-legacy.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs"
          unzip -l "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Проверить теги собранного ядра
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/aarcheck"
          mkdir -p "$RUNNER_TEMP/aarcheck"
          unzip -o -q app/libs/libbox.aar -d "$RUNNER_TEMP/aarcheck"
          SO="$(find "$RUNNER_TEMP/aarcheck" -name libbox.so | head -1)"
          TAGS="$(strings -a "$SO" | grep -m1 -- '-tags=' || true)"
          echo "теги ядра: $TAGS"
          case "$TAGS" in
            *with_clash_api*) ;;
            *)
              echo "::error::ядро собрано без with_clash_api: конфиг с experimental.clash_api ядро отвергнет целиком, и VPN будет выключаться сразу после включения"
              exit 1
              ;;
          esac
          case "$TAGS" in
            *with_xhttp*) ;;
            *)
              echo "::error::ядро собрано без with_xhttp: узлы XHTTP не заработают"
              exit 1
              ;;
          esac

      - name: Upload libbox-aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            app/libs/libbox.aar
            app/libs/libbox-legacy.aar
          if-no-files-found: error
